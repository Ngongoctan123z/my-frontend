name: Prepare supported Next.js lockfile
on:
  push:
    branches: [fix/google-web-speech-original-audio]
    paths: [.github/workflows/prepare-supported-next.yml]
permissions:
  contents: write
jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-web-speech-original-audio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update supported framework and lockfile
        run: |
          npm pkg set 'scripts.build=next build --webpack' 'scripts.dev=next dev --webpack'
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.2
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.2
      - name: Save reproducible dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Upgrade to supported Next.js 16 and preserve webpack builds'
          git push origin HEAD:fix/google-web-speech-original-audio
