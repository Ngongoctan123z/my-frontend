name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency advisories
        run: node scripts/audit-security-dependencies.mjs

      - name: Test security boundaries and authentication defaults
        timeout-minutes: 2
        run: |
          node --experimental-vm-modules tests/security.test.mjs
          node --experimental-vm-modules tests/turnstile-config.test.mjs
          node tests/admin-layout-security.test.mjs
          node --experimental-vm-modules tests/auth-secret-provision.test.mjs

      - name: Prepare validated Writing bank assets
        run: npm run prepare:writing-bank

      - name: Test API key rotation
        run: npm run test:api-rotation

      - name: Test GPMPay payment authentication and atomic settlement
        run: npm run test:payments

      - name: Test private R2 provisioning
        run: node --experimental-vm-modules tests/r2-provision.test.mjs

      - name: Test grader submissions
        run: npm run test:grader-submissions

      - name: Test learner prompt privacy and server-side grading context
        run: |
          node --experimental-vm-modules tests/prompt-context.test.mjs
          node tests/shared-prompt-privacy.test.mjs

      - name: Test linked TOEIC sets and real photo bank
        run: node --experimental-vm-modules tests/toeic-sets.test.mjs

      - name: Test TOPIK and HSK question bank
        run: node --experimental-vm-modules tests/writing-bank.test.mjs

      - name: Test canonical Writing admin overview
        run: node --experimental-vm-modules tests/writing-overview.test.mjs

      - name: Test retired sections, noindex and active navigation
        run: |
          node tests/site-retirement.test.mjs
          node --experimental-vm-modules tests/retired-seo-admin.test.mjs

      - name: Test build-time SEO behavior
        run: npm run test:build-seo

      - name: Test Speaking submissions and question formats
        run: npm run test:speaking

      - name: Check changed Speaking, Writing and admin TypeScript
        run: node tests/check-speaking-types.mjs

      - name: Build Next.js and OpenNext
        run: npm run pages:build

      - name: Run built Worker with local D1 and R2
        run: |
          node tests/worker-runtime-smoke.mjs
          node tests/public-bundle-privacy.test.mjs

      - name: Install browser for grader UI checks
        timeout-minutes: 5
        run: |
          if ! timeout 90s npx playwright install-deps chromium; then
            echo "::warning::Browser dependency installation did not complete; validating the runner's existing libraries with the browser tests."
          fi
          npx playwright install chromium

      - name: Test grader inputs and mobile layouts
        run: npm run test:grader-ui

      - name: Test Speaking recording and mobile layouts
        run: npm run test:speaking-ui

      - name: Test photo bank, exam links, live speech and floating tools
        run: node tests/phase2-ui.test.mjs

      - name: Test focused Writing and Speaking navigation
        run: node tests/site-retirement-ui.test.mjs

      - name: Test unified Writing admin and legacy deep links
        run: |
          node tests/admin-writing-ui.test.mjs
          node tests/admin-turnstile-ui.test.mjs

      - name: Verify deployed D1 catalogs and private Speaking routes
        if: github.ref == 'refs/heads/main'
        run: |
          node tests/deployed-speaking.mjs
          node tests/deployed-security.mjs

      - name: Verify indexed legacy URLs and active canonicals on both hostnames
        if: github.ref == 'refs/heads/main'
        run: node scripts/audit-indexed-urls.mjs --verify

      - name: Save grader screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grader-ui-screenshots
          path: |
            test-results/gpmpay-ui
            test-results/grader-ui
            test-results/speaking-ui
            test-results/phase2-ui
            test-results/admin-writing-ui
            test-results/admin-turnstile
            test-results/site-retirement-ui
            test-results/seo-index-audit.json
            test-results/worker-runtime.log
            test-results/security
          if-no-files-found: ignore

      # Cloudflare Workers Builds deploys main through the existing GitHub App
      # integration. This workflow verifies the same build without a second
      # deployment path or separate Cloudflare credentials.






