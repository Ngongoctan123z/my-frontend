name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare validated Writing bank assets
        run: npm run prepare:writing-bank

      - name: Test API key rotation
        run: npm run test:api-rotation

      - name: Test private R2 provisioning
        run: node --experimental-vm-modules tests/r2-provision.test.mjs

      - name: Test grader submissions
        run: npm run test:grader-submissions

      - name: Test linked TOEIC sets and real photo bank
        run: node --experimental-vm-modules tests/toeic-sets.test.mjs

      - name: Test TOPIK and HSK question bank
        run: node --experimental-vm-modules tests/writing-bank.test.mjs

      - name: Test build-time SEO behavior
        run: npm run test:build-seo

      - name: Test Speaking submissions and question formats
        run: npm run test:speaking

      - name: Check changed Speaking, Writing and admin TypeScript
        run: node tests/check-speaking-types.mjs

      - name: Build Next.js and OpenNext
        run: npm run pages:build

      - name: Install browser for grader UI checks
        run: npx playwright install --with-deps chromium

      - name: Test grader inputs and mobile layouts
        run: npm run test:grader-ui

      - name: Test Speaking recording and mobile layouts
        run: npm run test:speaking-ui

      - name: Test photo bank, exam links, live speech and floating tools
        run: node tests/phase2-ui.test.mjs

      - name: Verify deployed D1 catalogs and private Speaking routes
        if: github.ref == 'refs/heads/main'
        run: node tests/deployed-speaking.mjs

      - name: Save grader screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grader-ui-screenshots
          path: |
            test-results/grader-ui
            test-results/speaking-ui
            test-results/phase2-ui
          if-no-files-found: ignore

      # Cloudflare Workers Builds deploys main through the existing GitHub App
      # integration. This workflow verifies the same build without a second
      # deployment path or separate Cloudflare credentials.
